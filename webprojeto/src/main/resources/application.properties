# banco de dados
spring.application.name=webprojeto
# Fora do Docker usa o Postgres local; no Docker o compose define DB_URL com o host "database"
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/manutencao_db}
spring.datasource.username=${DB_USER:dev_user}
spring.datasource.password=${DB_PASS:dev_password}
spring.sql.init.mode=never

# envio de email 
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USER:manutencaoequipamentosweb@gmail.com}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.from=${MAIL_USER:manutencaoequipamentosweb@gmail.com}

# modo debug
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}