services:
  # Banco de Dados PostgreSQL 18 LTS
  database:
    image: postgres:18-alpine
    container_name: manutencao_db
    environment:
      POSTGRES_DB: manutencao_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  # Ambiente de Desenvolvimento (Node 24, JDK 21, Angular 21, OpenCode)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: thacer/manutencao-app:v1
    container_name: manutencao_app
    volumes:
      # Sincroniza o código local com o container
      - .:/workspace:cached
    ports:
      - "4200:4200" # Angular Dev Server
      - "8080:8080" # Spring Boot API (mesma porta usada pelo Angular)
    environment:
      DB_URL: jdbc:postgresql://database:5432/manutencao_db
      DB_USER: dev_user
      DB_PASS: dev_password
      SPRING_SQL_INIT_MODE: always
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  pgdata:
