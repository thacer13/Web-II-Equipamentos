<div class="p-6">
  <h2 class="text-xl font-semibold text-gray-800 mb-6">Nova Solicitação de Manutenção</h2>
  <form class="flex flex-col gap-5">

    <div>
      <label for="equipamento" class="block text-sm font-medium text-gray-700 mb-1">
        Descrição do Equipamento
      </label>
      <input 
        type="text" 
        id="equipamento"
        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm text-gray-900 bg-white" 
        placeholder="Ex: Notebook Dell Inspiron"
      />
    </div>

    <div>
      <label for="categoria" class="block text-sm font-medium text-gray-700 mb-1">
        Categoria do Equipamento
      </label>
      <input 
        type="text" 
        id="categoria"
        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm text-gray-900 bg-white" 
        placeholder="Ex: Informática"
      />
    </div>

    <div>
      <label for="defeito" class="block text-sm font-medium text-gray-700 mb-1">
        Descrição do Defeito
      </label>
      <textarea 
        id="defeito"
        rows="4"
        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm resize-none text-gray-900 bg-white" 
        placeholder="Descreva detalhadamente qual é o problema..."
      ></textarea>
    </div>

    <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-gray-100">
      <button
        type="button" (click)="botaoCancelar()"
        class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 rounded-lg transition-colors"
      >
        Cancelar
      </button>
      <button 
        type="submit" 
        class="px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors shadow-sm"
      >
        Solicitar Orçamento
      </button>
    </div>

  </form>
</div>
