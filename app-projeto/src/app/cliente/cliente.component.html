<main class="max-w-5xl mx-auto my-10 px-5">

  <header class="flex justify-between items-center mb-8">
    <h1 class="text-2xl font-semibold text-gray-800">
      Minhas Solicitações
    </h1>
    <button class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-5 py-2.5 font-medium transition-colors"
    (click)="abrirFormulario()">
      Nova Solicitação
    </button>
  </header>

    @if(mostrarFormulario) {
      <div class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden mb-8">
        <app-cliente-solicitacao (aoCancelar)="fecharFormulario()"></app-cliente-solicitacao>
      </div>
    }

  <div class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-50">
          <th class="px-6 py-4 text-sm font-medium text-gray-600">Data/Hora</th>
          <th class="px-6 py-4 text-sm font-medium text-gray-600">Descrição</th>
          <th class="px-6 py-4 text-sm font-medium text-gray-600">Estado</th>
          <th class="px-6 py-4 text-sm font-medium text-gray-600">Ações</th>
        </tr>
      </thead>

      <tbody>
        <tr class="border-t border-gray-100 hover:bg-gray-50 transition-colors">
          <td class="px-6 py-4 text-sm text-gray-700">00/00/0000 00:00</td>
          <td class="px-6 py-4 text-sm text-gray-700">Xxxxxxx Yyyyyyy</td>
          <td class="px-6 py-4 text-sm">
            <span class="inline-block bg-amber-100 text-amber-700 text-xs font-medium px-3 py-1 rounded-full">
              XXXXXXX
            </span>
          </td>
          <td class="px-6 py-4 text-sm">
            <div class="flex gap-2">
              <button class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors">
                Visualizar Serviço
              </button>
              <button class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors">
                Xxxxxxx Serviço
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</main>
