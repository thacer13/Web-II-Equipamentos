<form [formGroup]="cadastroForm" (ngSubmit)="onSubmit()">
   <div class="form-group">
     <label for="cpf">CPF</label>
     <p-inputMask id="cpf" formControlName="cpf" mask="999.999.999-99" placeholder="999.999.999-99"></p-inputMask>
   </div>
   <div class="form-group">
     <label for="nome">Nome completo</label>
     <input id="nome" type="text" formControlName="nome" pInputText>
   </div>
   <div class="form-group">
     <label for="email">E-mail</label>
     <input id="email" type="email" formControlName="email" pInputText>
   </div>
   <div class="form-group">
     <label for="telefone">Telefone</label>
     <p-inputMask id="telefone" formControlName="telefone" mask="(99) 99999-9999" placeholder="(99) 99999-9999"></p-inputMask>
   </div>
  <hr>
  <h3>Endereço</h3>
  <div class="form-group">
    <label for="cep">CEP</label>
    <p-inputMask id="cep" formControlName="cep" mask="99999-999" placeholder="99999-999" (onBlur)="buscarCep()"></p-inputMask>
  </div>
  <div class="form-group">
    <label for="logradouro">Rua/Logradouro</label>
    <input id="logradouro" type="text" formControlName="logradouro" pInputText>
  </div>
  <div class="form-group">
    <label for="numero">Número</label>
    <input id="numero" type="text" formControlName="numero" pInputText>
  </div>
  <div class="form-group">
    <label for="bairro">Bairro</label>
    <input id="bairro" type="text" formControlName="bairro" pInputText>
  </div>
  <div class="form-group">
    <label for="cidade">Cidade</label>
    <input id="cidade" type="text" formControlName="cidade" pInputText>
  </div>
  <div class="form-group">
    <label for="estado">Estado</label>
    <input id="estado" type="text" formControlName="estado" pInputText>
  </div>
   <p-button label="Cadastrar" type="submit" [disabled]="cadastroForm.invalid"></p-button>
</form>
