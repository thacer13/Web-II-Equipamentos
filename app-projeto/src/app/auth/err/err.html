<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Recuperar Senha</h1>
      <p class="login-subtitle">Informe seu e-mail cadastrado para receber as instruções</p>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <div class="login-fields">
        <p-floatLabel>
          <input
            pInputText
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            [(ngModel)]="email"
            [disabled]="loading"
            required
          />
          <label for="email">E-mail</label>
        </p-floatLabel>
      </div>

      @if (mensagemErro) {
        <p class="feedback feedback-erro" role="alert">{{ mensagemErro }}</p>
      }
      @if (mensagemSucesso) {
        <p class="feedback feedback-sucesso" role="status">{{ mensagemSucesso }}</p>
      }

      <button
        pButton
        type="submit"
        [label]="loading ? 'Enviando...' : 'Enviar'"
        class="btn-primary"
        [disabled]="loading"
      ></button>

      <div class="login-actions">
        <a routerLink="/auth/login" class="btn-link esqueceu-link">Voltar para o Login</a>
      </div>
    </form>
  </div>
</div>
