<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Recuperar Senha</h1>
      <p class="login-subtitle">Informe seu e-mail cadastrado para receber as instruções</p>
    </div>

    <form class="login-form">
      <div class="login-fields">
        <p-floatLabel>
          <input pInputText id="email" type="email" autocomplete="email" />
          <label for="email">E-mail</label>
        </p-floatLabel>
      </div>

      <button pButton type="submit" label="Enviar" class="btn-primary"></button>

      <div class="login-actions">
        <a routerLink="/auth/login" class="btn-link esqueceu-link">Voltar para o Login</a>
      </div>
    </form>
  </div>
</div>
