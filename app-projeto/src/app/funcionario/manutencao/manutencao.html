<div class="app-shell">
    <div *ngIf="solicitacao" class="app-shell__narrow app-card overflow-hidden">
        <div class="border-b border-gray-200 bg-white px-6 py-4">
            <h2 class="text-lg font-semibold text-gray-800">
                Manutenção da Solicitação #{{ solicitacao.id }}
            </h2>
        </div>

        <div class="flex flex-col gap-2 border-b border-gray-200 p-6 text-sm text-gray-800">
            <p><span class="font-medium">Data/Hora:</span> {{ solicitacao.dataHora | date:'dd/MM/yyyy HH:mm' }}</p>
            <p><span class="font-medium">Cliente:</span> {{ solicitacao.cliente?.nome || 'Não informado' }}</p>
            <p><span class="font-medium">Produto:</span> {{ solicitacao.descricaoEquipamento }}</p>
            <p><span class="font-medium">Problema:</span> {{ solicitacao.descricaoDefeito }}</p>
        </div>

        <form class="flex flex-col gap-4 p-6">
            <div class="flex flex-col gap-1">
                <label class="text-sm font-semibold text-gray-700">Descrição da Manutenção</label>
                <textarea
                    class="w-full rounded border border-gray-300 p-2 text-sm"
                    style="min-height: 70px; resize: none;"
                    placeholder="Ex: Troca da tela do notebook"
                    [(ngModel)]="descricaoManutencao"
                    name="descricaoManutencao">
                </textarea>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-sm font-semibold text-gray-700">Orientações para o Cliente</label>
                <textarea
                    class="w-full rounded border border-gray-300 p-2 text-sm"
                    style="min-height: 70px; resize: none;"
                    placeholder="Ex: Evitar deixar o notebook na tomada o dia todo"
                    [(ngModel)]="orientacoesCliente"
                    name="orientacoesCliente">
                </textarea>
            </div>

            <div class="flex gap-3">
                <p-button
                    type="button"
                    label="Voltar"
                    styleClass="p-button-secondary"
                    (click)="voltar()">
                </p-button>
                <p-button
                    type="button"
                    label="Redirecionar"
                    styleClass="p-button-secondary"
                    (click)="onRedirecionarClick()">
                </p-button>
                <p-button
                    type="button"
                    label="Efetuar Manutenção"
                    (click)="onConfirmarManutencao()">
                </p-button>
            </div>
        </form>
    </div>
</div>
