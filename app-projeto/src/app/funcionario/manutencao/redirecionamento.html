<div class="flex min-h-screen w-full items-center justify-center bg-gray-100 p-4">
    <div class="w-full max-w-md overflow-hidden rounded-lg bg-white shadow-md">
        <div class="border-b border-gray-200 bg-white px-6 py-4">
            <h2 class="text-lg font-semibold text-gray-800">
                Redirecionar Manutenção
            </h2>
        </div>

        <div class="flex flex-col gap-2 border-b border-gray-200 p-6 text-sm text-gray-800">
            <p><span class="font-medium">Data/Hora:</span> {{ dataSolicitacao }}</p>
            <p><span class="font-medium">Cliente:</span> {{ cliente }}</p>
            <p><span class="font-medium">Produto:</span> {{ produto }}</p>
            <p><span class="font-medium">Problema:</span> {{ descricaoProblema }}</p>
        </div>

        <form class="flex flex-col gap-4 p-6">
            <div class="flex flex-col gap-1">
                <label class="text-sm font-semibold text-gray-700">Redirecionar para</label>
                <select
                    class="w-full rounded border border-gray-300 p-2 text-sm"
                    [(ngModel)]="funcionarioDestino"
                    name="funcionarioDestino">
                    <option value="" disabled selected>Selecione um funcionário</option>
                    @for (funcionario of funcionariosDisponiveis; track funcionario) {
                        <option [value]="funcionario">{{ funcionario }}</option>
                    }
                </select>
            </div>

            <div class="flex gap-3">
                <p-button
                    type="button"
                    label="Redirecionar"
                    (click)="onConfirmarRedirecionamento()">
                </p-button>
            </div>
        </form>
    </div>
</div>
